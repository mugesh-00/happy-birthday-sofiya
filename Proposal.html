<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Will You Be Mine Forever? ❤️</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#ff5fa2,#ff7eb3);
overflow:hidden;
}

.container{
background:white;
padding:35px;
border-radius:20px;
text-align:center;
box-shadow:0 10px 25px rgba(0,0,0,.2);
max-width:420px;
width:90%;
}

h1{
color:#ff2d75;
margin-bottom:20px;
}

p{
font-size:18px;
color:#444;
line-height:1.7;
margin-bottom:25px;
}

button{
padding:12px 28px;
font-size:18px;
border:none;
border-radius:30px;
cursor:pointer;
margin:10px;
}

#yesBtn{
background:#ff2d75;
color:white;
}

#noBtn{
background:#666;
color:white;
position:absolute;
}

</style>
</head>

<body>

<div class="container">

<h1>💍 Will You Be Mine Forever? ❤️</h1>

<p>
Sofiya... ❤️<br><br>
Will you stay with me forever?
</p>

<button id="yesBtn" onclick="yesAnswer()">Yes ❤️</button>

<button id="noBtn">No 💔</button>

</div>

<script>

const noBtn=document.getElementById("noBtn");

noBtn.addEventListener("mouseover",function(){

noBtn.style.left=Math.random()*(window.innerWidth-120)+"px";

noBtn.style.top=Math.random()*(window.innerHeight-80)+"px";

});

function yesAnswer(){

alert("❤️ Thank You My Love ❤️\n\nInime en smile-ku reason nee...\nEn life-ku meaning-um nee dhaan. ❤️\n\nInime ovvoru birthday-yum,\novvoru smile-um,\novvoru dream-um un kooda celebrate pannanum. ❤️🥹");

window.location.href="index.html";

}

</script>

</body>
</html>
