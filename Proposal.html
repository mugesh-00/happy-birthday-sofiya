<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Will You Be Mine? ❤️</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#ff5fa2,#ff7eb3);
overflow:hidden;
}

.container{
text-align:center;
background:white;
padding:35px;
border-radius:20px;
box-shadow:0 10px 25px rgba(0,0,0,.2);
max-width:400px;
}

h1{
color:#ff2d75;
margin-bottom:20px;
font-size:28px;
}

p{
font-size:18px;
color:#555;
margin-bottom:25px;
}

button{
padding:12px 30px;
font-size:18px;
border:none;
border-radius:30px;
cursor:pointer;
margin:10px;
transition:.3s;
}

#yesBtn{
background:#ff2d75;
color:white;
}

#yesBtn:hover{
background:#ff0a61;
}

#noBtn{
background:#666;
color:white;
position:absolute;
}

#message{
display:none;
margin-top:20px;
font-size:22px;
color:#ff2d75;
font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

<h1>💍 Will You Be Mine Forever? ❤️</h1>

<p>
Sofiya... ❤️<br><br>
Will you stay with me forever?
</p>

<button id="yesBtn" onclick="yesAnswer()">Yes ❤️</button>

<button id="noBtn">No 💔</button>

<div id="message">
❤️ Yaaay! ❤️<br><br>
Thank You My Love 🥹💕<br>
Happy Birthday Once Again ❤️
</div>

</div>

<script>
const noBtn=document.getElementById("noBtn");

noBtn.addEventListener("mouseover",()=>{
noBtn.style.left=Math.random()*(window.innerWidth-120)+"px";
noBtn.style.top=Math.random()*(window.innerHeight-60)+"px";
});

function yesAnswer(){
document.getElementById("message").style.display="block";

setTimeout(()=>{
window.location.href="index.html";
},4000);
}
</script>

</body>
</html>
