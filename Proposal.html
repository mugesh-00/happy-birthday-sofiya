<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Will You Be Mine Forever? ❤️</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(135deg,#ff5fa2,#ff7eb3);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:hidden;
}

.container{
background:#fff;
padding:35px;
border-radius:20px;
text-align:center;
box-shadow:0 10px 25px rgba(0,0,0,.2);
width:90%;
max-width:420px;
position:relative;
z-index:2;
}

h1{
color:#ff2d75;
margin-bottom:20px;
}

p{
font-size:18px;
color:#555;
margin-bottom:25px;
line-height:1.7;
}

button{
padding:12px 28px;
font-size:18px;
border:none;
border-radius:30px;
cursor:pointer;
margin:10px;
transition:.3s;
}

#yesBtn{
background:#ff2d75;
color:white;
}

#yesBtn:hover{
background:#ff0a61;
}

#noBtn{
background:#666;
color:white;
position:absolute;
}

.heart{
position:fixed;
top:-30px;
color:red;
pointer-events:none;
animation:fall linear forwards;
}

@keyframes fall{
0%{
transform:translateY(-30px);
opacity:1;
}
100%{
transform:translateY(110vh);
opacity:0;
}
}
</style>
</head>

<body>

<div class="container">

<h1>💍 Will You Be Mine Forever? ❤️</h1>

<p>
Sofiya... ❤️<br><br>
Will you stay with me forever?
</p>

<button id="yesBtn" onclick="yesAnswer()">
Yes ❤️
</button>

<button id="noBtn">
No 💔
</button>

</div>

<audio id="bgMusic" loop>
<source src="music/love.mp3" type="audio/mpeg">
</audio>

<script>

const music=document.getElementById("bgMusic");

function startMusic(){
music.play().catch(()=>{});
}

document.addEventListener("click",startMusic,{once:true});
document.addEventListener("touchstart",startMusic,{once:true});

const noBtn=document.getElementById("noBtn");

noBtn.addEventListener("mouseover",()=>{

noBtn.style.left=Math.random()*(window.innerWidth-120)+"px";

noBtn.style.top=Math.random()*(window.innerHeight-80)+"px";

});

function yesAnswer(){

music.play().catch(()=>{});

alert("❤️ Thank You My Love ❤️\n\nInime en smile-ku reason nee...\nEn life-ku meaning-um nee dhaan. ❤️\n\nInime ovvoru birthday-yum,\novvoru smile-um,\novvoru dream-um un kooda celebrate pannanum. ❤️🥹");

window.location.href="index.html";

}

setInterval(()=>{

const heart=document.createElement("div");

heart.className="heart";

heart.innerHTML="❤️";

heart.style.left=Math.random()*100+"vw";

heart.style.fontSize=(15+Math.random()*20)+"px";

heart.style.animationDuration=(4+Math.random()*3)+"s";

document.body.appendChild(heart);

setTimeout(()=>{
heart.remove();
},7000);

},350);

</script>

</body>
</html>
