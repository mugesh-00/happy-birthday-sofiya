<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Will You Be Mine? ❤️</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ff8fb1,#ff4f81);
    font-family:Arial,sans-serif;
    overflow:hidden;
}

.box{
    text-align:center;
    color:white;
}

h1{
    font-size:32px;
    margin-bottom:30px;
}

button{
    padding:12px 30px;
    font-size:20px;
    border:none;
    border-radius:30px;
    cursor:pointer;
    margin:10px;
}

#yes{
    background:#ffffff;
    color:#ff2d75;
}

#no{
    background:#ff2d75;
    color:white;
    position:absolute;
}
</style>
</head>

<body>

<div class="box">
    <h1>💖 Sofiya, Will You Be Mine Forever? 💖</h1>

    <button id="yes" onclick="yesClick()">Yes ❤️</button>

    <button id="no">No 💔</button>
</div>

<script>
function yesClick(){
    alert("Yay! ❤️ I Love You Forever, Sofiya 🥹💕");
    window.location.href="index.html";
}

const no=document.getElementById("no");

no.addEventListener("mouseover",function(){
    no.style.left=Math.random()*(window.innerWidth-120)+"px";
    no.style.top=Math.random()*(window.innerHeight-60)+"px";
});
</script>

</body>
</html>
