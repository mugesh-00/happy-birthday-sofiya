<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Memories ❤️</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(135deg,#ff5fa2,#ff7eb3);
padding:20px;
text-align:center;
overflow-x:hidden;
}

h1{
color:white;
margin-bottom:20px;
font-size:32px;
}

.gallery{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:12px;
max-width:420px;
margin:auto;
}

.gallery img{
width:100%;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.3);
transition:.3s;
}

.gallery img:hover{
transform:scale(1.05);
}

button{
margin-top:25px;
padding:12px 30px;
font-size:18px;
border:none;
border-radius:30px;
background:#ff2d75;
color:white;
cursor:pointer;
}

button:hover{
background:#ff0a61;
}

.heart{
position:fixed;
top:-40px;
color:red;
pointer-events:none;
animation:fall linear forwards;
}

@keyframes fall{
0%{
transform:translateY(-40px);
opacity:1;
}
100%{
transform:translateY(110vh);
opacity:0;
}
}
</style>

</head>
<body>

<h1>📸 Our Memories ❤️</h1>

<div class="gallery">

<img src="images/IMG-20251009-WA0004.jpg">
<img src="images/IMG-20251013-WA0054.jpg">
<img src="images/IMG-20251017-WA0032.jpg">
<img src="images/IMG_20250712_102538.jpg">
<img src="images/IMG_20250712_102603.jpg">
<img src="images/SAVE_20251104_203151.jpg">
<img src="images/SAVE_20251104_203432_1762999286112.jpg">
<img src="images/SAVE_20251104_203517.jpg">
<img src="images/Snapshot-551487055.jpg">

</div>

<button onclick="nextPage()">
Continue ❤️
</button>

<audio id="bgMusic" loop>
<source src="music/love.mp3" type="audio/mpeg">
</audio>

<script>

const music=document.getElementById("bgMusic");

function startMusic(){
music.play().catch(()=>{});
}

document.addEventListener("click",startMusic,{once:true});
document.addEventListener("touchstart",startMusic,{once:true});

function nextPage(){
music.play().catch(()=>{});
setTimeout(()=>{
window.location.href="letter.html";
},500);
}

setInterval(()=>{

const heart=document.createElement("div");

heart.className="heart";

heart.innerHTML="❤️";

heart.style.left=Math.random()*100+"vw";

heart.style.fontSize=(15+Math.random()*20)+"px";

heart.style.animationDuration=(4+Math.random()*3)+"s";

document.body.appendChild(heart);

setTimeout(()=>{
heart.remove();
},7000);

},350);

</script>

</body>
</html>
