<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Sofiya ❤️</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(135deg,#ff5fa2,#ff7eb3);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:hidden;
}

.card{
background:white;
padding:30px;
border-radius:20px;
text-align:center;
max-width:350px;
box-shadow:0 10px 25px rgba(0,0,0,.2);
}

h1{
color:#ff2d75;
margin-bottom:15px;
}

p{
color:#555;
margin-bottom:20px;
}

button{
background:#ff2d75;
color:white;
border:none;
padding:12px 25px;
font-size:18px;
border-radius:30px;
cursor:pointer;
}

button:hover{
background:#ff0a61;
}

.heart{
position:absolute;
color:red;
font-size:20px;
animation:fall 6s linear infinite;
}

@keyframes fall{
0%{
transform:translateY(-100px);
opacity:1;
}
100%{
transform:translateY(110vh);
opacity:0;
}
}
</style>

</head>

<body>

<div class="card">

<h1>🎂 Happy Birthday Sofiya ❤️</h1>

<p>
Wishing you endless happiness,<br>
smiles and love. ✨
</p>

<button onclick="location.href='gallery.html'">
Open Surprise 🎁
</button>

</div>

<script>
setInterval(()=>{
const heart=document.createElement("div");
heart.className="heart";
heart.innerHTML="❤️";
heart.style.left=Math.random()*100+"vw";
heart.style.fontSize=(15+Math.random()*20)+"px";
document.body.appendChild(heart);

setTimeout(()=>{
heart.remove();
},6000);

},400);
</script>
<audio id="bgMusic" autoplay loop>
    <source src="music/love.mp3" type="audio/mpeg">
</audio>

<script>
document.addEventListener("click", function () {
    document.getElementById("bgMusic").play();
}, { once: true });
</script>

</body>
</html>
